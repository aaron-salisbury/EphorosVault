name: Build and Test

on:
  push:
    branches: [ main, feature/vault-mvp ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore src/EphorosVault.slnx -PackagesDirectory src/packages

      - name: Build
        run: msbuild src/EphorosVault.slnx /p:Configuration=Release /m

      - name: Test
        run: vstest.console.exe src/EphorosVault.Tests/bin/Release/EphorosVault.Tests.dll
